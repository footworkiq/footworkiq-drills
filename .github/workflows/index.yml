name: Rebuild Artifacts

on:
  push:
    branches: [main]
    paths:
      - 'drills/**'
      - 'cards/**'
      - 'docs/schema/**'
      - 'scripts/build-index.js'
      - 'scripts/validate-drills.js'
      - 'scripts/build-card-bundle.js'
      - 'scripts/validate-cards.js'
      - 'scripts/lib/**'
  workflow_dispatch:

# One rebuild at a time so two auto-commits never race (non-fast-forward).
concurrency:
  group: rebuild-artifacts
  cancel-in-progress: false

jobs:
  rebuild-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the push's BEFORE commit must exist locally so the
          # purge step can diff it to find changed drills.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Validate drill JSON files
        run: node scripts/validate-drills.js
      - name: Validate decision cards
        run: node scripts/validate-cards.js
      - name: Build index.json
        run: node scripts/build-index.js
      - name: Build decision card bundle
        run: node scripts/build-card-bundle.js
      - uses: stefanzweifel/git-auto-commit-action@v7
        id: autocommit
        with:
          commit_message: "chore: rebuild index.json and card bundle [skip ci]"
          file_pattern: "index.json cards/decision.bundle.json"
      - name: Purge jsDelivr card bundle
        if: steps.autocommit.outputs.changes_detected == 'true'
        run: sleep 15 && curl -fsS --retry 3 --retry-delay 10 https://purge.jsdelivr.net/gh/footworkiq/footworkiq-drills@main/cards/decision.bundle.json
      # Not gated on changes_detected: a sequence-only drill fix leaves
      # index.json unchanged but the drill file itself is still stale at the CDN.
      # SHAs reach the script only via env; purge-paths.js validates them and
      # allow-lists every path. On workflow_dispatch BEFORE is empty, so only
      # index.json is purged.
      - name: Purge jsDelivr index and changed drills
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          paths="$(node scripts/purge-paths.js "$BEFORE" "$AFTER")"
          sleep 15
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            resp="$(curl -fsS --retry 3 --retry-delay 10 "https://purge.jsdelivr.net/gh/footworkiq/footworkiq-drills@main/$p")"
            echo "purged $p"
            echo "$resp"
            if printf '%s' "$resp" | grep -Eq '"throttled": ?true'; then
              echo "::warning::jsDelivr throttled purge of $p"
            fi
          done <<< "$paths"
