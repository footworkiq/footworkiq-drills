name: Validate Content

on:
  pull_request:
    branches: [main]
    paths:
      - 'drills/**'
      - 'docs/schema/**'
      - 'cards/**'
      - 'scripts/**'
      - 'package*.json'
      - 'test/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the frozen-id check can read the PR base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run content tests
        run: npm test
      - name: Validate drill JSON files
        run: node scripts/validate-drills.js
      - name: Validate decision cards (schema, quality lints, frozen ids and rev bumps vs the PR base)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/validate-cards.js --base "$BASE_REF"
